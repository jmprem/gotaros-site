<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 820" role="img" aria-labelledby="t d">
  <title id="t">The runtime monitoring loop</title>
  <desc id="d">1. Your autonomous system reports an event to TAROS. 2. TAROS checks it against signed, versioned policies. 3. TAROS returns a decision — allow, hold or block — and your system carries it out. 4. The decision is recorded with its reason.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#231F20"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #231F20; }
    .title { font-size: 25px; font-weight: 700; }
    .body { font-size: 19px; fill: #555555; }
    .step { font-size: 19px; font-weight: 700; }
    .num { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .chip { font-size: 20px; font-weight: 700; }
    .field { font-size: 18px; font-weight: 600; fill: #555555; }
  </style>

  <!-- 1. Autonomous system -->
  <rect x="20" y="20" width="520" height="140" rx="16" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
  <text x="280" y="66" class="title" text-anchor="middle">Your autonomous system</text>
  <text x="280" y="102" class="body" text-anchor="middle">Robot fleet · AI/SI agent · workflow</text>
  <text x="280" y="132" class="body" text-anchor="middle">Reports events, carries out decisions</text>

  <!-- Event reported (down) -->
  <line x1="180" y1="162" x2="180" y2="236" stroke="#231F20" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="44" cy="200" r="14" fill="#0092D5"/><text x="44" y="206" class="num" text-anchor="middle">1</text>
  <text x="166" y="206" class="step" text-anchor="end">Event</text>

  <!-- Decision returned (up) -->
  <line x1="380" y1="238" x2="380" y2="164" stroke="#231F20" stroke-width="2" marker-end="url(#ah)"/>
  <text x="394" y="206" class="step">Decision</text>
  <circle cx="516" cy="200" r="14" fill="#0092D5"/><text x="516" y="206" class="num" text-anchor="middle">3</text>

  <!-- 2. TAROS -->
  <rect x="20" y="240" width="520" height="260" rx="18" fill="#EAF6FC" stroke="#0092D5" stroke-width="3"/>
  <text x="280" y="288" text-anchor="middle" style="font-size:28px;font-weight:800;fill:#0092D5;letter-spacing:.06em">TAROS</text>
  <circle cx="54" cy="332" r="14" fill="#0092D5"/><text x="54" y="338" class="num" text-anchor="middle">2</text>
  <text x="78" y="339" style="font-size:19px;font-weight:600">Checked against signed, versioned policies</text>

  <rect x="40" y="370" width="150" height="52" rx="26" fill="#0092D5"/>
  <text x="115" y="403" class="chip" text-anchor="middle" style="fill:#FFFFFF">Allow</text>
  <rect x="205" y="370" width="150" height="52" rx="26" fill="#FFD500"/>
  <text x="280" y="403" class="chip" text-anchor="middle">Hold</text>
  <rect x="370" y="370" width="150" height="52" rx="26" fill="#231F20"/>
  <text x="445" y="403" class="chip" text-anchor="middle" style="fill:#FFFFFF">Block</text>
  <text x="280" y="464" class="body" text-anchor="middle">…always with the reason</text>

  <!-- Recorded (down) -->
  <line x1="280" y1="502" x2="280" y2="576" stroke="#231F20" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="310" cy="538" r="14" fill="#0092D5"/><text x="310" y="544" class="num" text-anchor="middle">4</text>
  <text x="334" y="545" class="step">Recorded</text>

  <!-- 4. Decision record -->
  <rect x="20" y="580" width="520" height="220" rx="16" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
  <text x="50" y="624" class="title" style="font-size:22px">Decision record</text>
  <text x="50" y="666" class="field">Event</text>
  <rect x="220" y="652" width="280" height="16" rx="8" fill="#EEEEEE"/>
  <text x="50" y="702" class="field">Policy matched</text>
  <rect x="220" y="688" width="230" height="16" rx="8" fill="#EEEEEE"/>
  <text x="50" y="738" class="field">Decision</text>
  <rect x="220" y="724" width="96" height="16" rx="8" fill="#0092D5" opacity=".75"/>
  <text x="50" y="774" class="field">Reason</text>
  <rect x="220" y="760" width="260" height="16" rx="8" fill="#EEEEEE"/>
</svg>
